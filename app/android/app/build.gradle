plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def pubspecVersion = '1.0+1'
def pubspecFile = rootProject.file('../pubspec.yaml')
if (pubspecFile.exists()) {
    def match = pubspecFile.text =~ /(?m)^version:\s*([^\s]+)/
    if (match.find()) {
        pubspecVersion = match.group(1)
    }
}
def pubspecVersionParts = pubspecVersion.split('\\+', 2)

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = pubspecVersionParts.length > 1 ? pubspecVersionParts[1] : '1'
}

def flutterVersionName = System.getenv('RELEASE_VERSION_NAME') ?: localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = pubspecVersionParts[0]
}

android {
    namespace "com.samliao.localsend"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.samliao.localsend"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion 30
        targetSdkVersion 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }

            def keyAliasValue = keystoreProperties['keyAlias'] ?: System.getenv('SIGNING_KEY_ALIAS')
            def keyPasswordValue = keystoreProperties['keyPassword'] ?: System.getenv('SIGNING_KEY_PASSWORD')
            def storeFileValue = keystoreProperties['storeFile'] ?: System.getenv('SIGNING_KEYSTORE_PATH')
            def storePasswordValue = keystoreProperties['storePassword'] ?: System.getenv('SIGNING_STORE_PASSWORD')

            keyAlias keyAliasValue
            keyPassword keyPasswordValue
            storeFile storeFileValue ? file(storeFileValue) : null
            storePassword storePasswordValue
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // Required by F-Droid
    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source '../..'
}

// To comply with F-Droid version code schema
// https://github.com/localsend/localsend/issues/1534
ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}

tasks.register("copyReleaseApk") {
    doLast {
        def repoRoot = rootProject.projectDir.parentFile.parentFile
        def releaseDir = new File(repoRoot, "release/${flutterVersionName}")
        def apkDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
        def flutterApkDir = layout.buildDirectory.dir("outputs/flutter-apk").get().asFile
        def apk = [
            new File(flutterApkDir, "app-arm64-v8a-release.apk"),
            new File(apkDir, "app-arm64-v8a-release.apk"),
        ].find { it.exists() }

        if (apk == null) {
            throw new GradleException("Could not find arm64 release APK in ${flutterApkDir} or ${apkDir}")
        }

        copy {
            from apk
            into releaseDir
            rename { "release.apk" }
        }
    }
}

tasks.matching { it.name == "assembleRelease" }.configureEach {
    finalizedBy("copyReleaseApk")
}
